name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Install, Lint, Test, Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maru
          POSTGRES_PASSWORD: maru
          POSTGRES_DB: maru_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Set database URLs
        run: |
          SCHEME=postgresql
          USER=maru
          PASS=maru
          HOST=localhost
          PORT=5432
          DB=maru_test
          URL="${SCHEME}://${USER}:${PASS}@${HOST}:${PORT}/${DB}"
          echo "DATABASE_URL=${URL}" >> $GITHUB_ENV
          echo "TEST_DATABASE_URL=${URL}" >> $GITHUB_ENV

      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Apply database migrations
        run: yarn prisma:migrate:deploy

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Build
        run: yarn build
