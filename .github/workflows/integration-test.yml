name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integration-test:
    name: Install, Migrate, Integration Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maru
          POSTGRES_PASSWORD: maru
          POSTGRES_DB: maru_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3001
      RESEND_API_KEY: e2e-test-key
      EMAIL_FROM: e2e-test@example.com
      AWS_REGION: aws-region-test
      AWS_S3_BUCKET: aws-s3-bucket-test
      AWS_ACCESS_KEY_ID: aws-access-key-id-test
      AWS_SECRET_ACCESS_KEY: aws-secret-access-key-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Set database URLs
        run: |
          SCHEME=postgresql
          USER=maru
          PASS=maru
          HOST=localhost
          PORT=5432
          DB=maru_test
          URL="${SCHEME}://${USER}:${PASS}@${HOST}:${PORT}/${DB}"
          echo "DATABASE_URL=${URL}" >> $GITHUB_ENV
          echo "TEST_DATABASE_URL=${URL}" >> $GITHUB_ENV

      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Apply database migrations
        run: yarn prisma:migrate:deploy

      - name: Integration tests
        run: yarn test:integration --runInBand
